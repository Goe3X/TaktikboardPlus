<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taktikboard">
<meta name="theme-color" content="#16212B">
<title>Taktikboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --eis:#EDF4F8;
    --eis-tief:#D7E5EE;
    --bande:#16212B;
    --linie-blau:#2B5FA8;
    --linie-rot:#C92F3C;
    --wir:#F2A413;
    --wir-tief:#B87703;
    --gegner:#6B3FA0;
    --gegner-tief:#4A2977;
    --aktiv:var(--wir);
    --aktiv-tief:var(--wir-tief);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;height:100dvh}
  body{
    background:var(--bande);
    font-family:ui-rounded, "SF Pro Rounded", "Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight:800;
    color:#fff;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }

  /* Die Bande leuchtet in der Farbe des Teams, das den Puck hat. */
  .rahmen{
    height:100%;
    display:flex;
    flex-direction:column;
    padding:calc(clamp(8px,1.6vmin,18px) + env(safe-area-inset-top))
            calc(clamp(8px,1.6vmin,18px) + env(safe-area-inset-right))
            calc(clamp(8px,1.6vmin,18px) + env(safe-area-inset-bottom))
            calc(clamp(8px,1.6vmin,18px) + env(safe-area-inset-left));
    background:var(--aktiv-tief);
    transition:background .45s ease;
  }
  @media (prefers-reduced-motion:reduce){
    .rahmen,.token,.pfeil-gross{transition:none !important}
  }

  .kopf{padding:.3em 0 .45em;text-align:center}
  .status{
    display:flex;align-items:center;justify-content:center;gap:.5em;
    font-size:clamp(14px,2.2vmin,22px);
    letter-spacing:.02em;
    text-transform:uppercase;
    opacity:.7;
  }
  .status .marke{
    width:.85em;height:.85em;border-radius:50%;
    background:var(--aktiv);
    border:.14em solid rgba(255,255,255,.85);
  }
  /* Der Aufgabentext ist für dich zum Vorlesen — deshalb groß und ruhig. */
  .aufgabe{
    font-size:clamp(20px,3.6vmin,38px);
    line-height:1.15;
    margin-top:.15em;
    padding:0 .5em;
    transition:opacity .3s ease;
  }
  .aufgabe.geloest{opacity:.45}

  .eisflaeche{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  svg{width:100%;height:100%;display:block}

  .token{cursor:grab;touch-action:none;transition:transform .5s cubic-bezier(.34,1.2,.5,1)}
  .token.zieht{transition:none;cursor:grabbing}
  .token circle{stroke:#fff;stroke-width:5}
  .du-ring{fill:none;stroke:#fff;stroke-width:6;opacity:.9}
  .puls{fill:none;stroke:#fff;stroke-width:8;opacity:0}
  .pfeil-gross{transition:transform .55s cubic-bezier(.34,1.1,.5,1), fill .45s ease}

  .steuerung{
    display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vmin,32px);
    padding:clamp(8px,1.6vmin,16px) 0 clamp(4px,1vmin,10px);
  }
  .puck-knopf{
    width:clamp(84px,15vmin,150px);height:clamp(84px,15vmin,150px);
    border-radius:50%;
    border:clamp(5px,.9vmin,9px) solid #fff;
    background:#0C1319;
    color:#fff;
    font:inherit;
    font-size:clamp(13px,2.1vmin,22px);
    line-height:1.05;
    text-transform:uppercase;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;
    box-shadow:0 clamp(5px,1vmin,10px) 0 rgba(0,0,0,.45);
    cursor:pointer;
  }
  .puck-knopf:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
  .puck-knopf .wechsel{font-size:1.5em;line-height:1}
  /* Der Würfel ist der Haupt-Knopf: neue Aufgabe. Deshalb heller und etwas größer. */
  .wuerfel-knopf{
    background:var(--aktiv);
    width:clamp(96px,17vmin,168px);height:clamp(96px,17vmin,168px);
    padding:clamp(14px,2.6vmin,28px);
    transition:background .45s ease;
  }
  .wuerfel-knopf svg{width:100%;height:100%;display:block}
  .neu{
    background:transparent;border:3px solid rgba(255,255,255,.45);
    color:rgba(255,255,255,.85);font:inherit;font-size:clamp(13px,1.9vmin,19px);
    text-transform:uppercase;padding:.55em 1.1em;border-radius:999px;cursor:pointer;
  }
  .neu:active{background:rgba(255,255,255,.14)}
  button:focus-visible{outline:4px solid #fff;outline-offset:4px}
</style>
</head>
<body>
<div class="rahmen" id="rahmen">

  <div class="kopf">
    <div class="status"><span class="marke"></span><span id="statusText">Wir haben den Puck</span></div>
    <div class="aufgabe" id="aufgabeText">Fahr nach vorne und biete dich an!</div>
  </div>

  <div class="eisflaeche">
    <svg id="board" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" aria-label="Eisfläche">
      <defs>
        <clipPath id="eisClip"><rect x="10" y="10" width="980" height="580" rx="120"/></clipPath>
      </defs>

      <!-- Eis -->
      <rect x="10" y="10" width="980" height="580" rx="120" fill="var(--eis)" stroke="#fff" stroke-width="10"/>
      <g clip-path="url(#eisClip)">
        <!-- Riesenpfeil: die Eisfläche selbst zeigt die Richtung -->
        <g id="pfeilGross" class="pfeil-gross" fill="var(--wir)" opacity=".16">
          <path d="M 180 260 H 640 V 190 L 830 300 L 640 410 V 340 H 180 Z"/>
        </g>
        <!-- Markierungen -->
        <line x1="500" y1="10" x2="500" y2="590" stroke="var(--linie-rot)" stroke-width="8" opacity=".5"/>
        <circle cx="500" cy="300" r="70" fill="none" stroke="var(--linie-blau)" stroke-width="7" opacity=".5"/>
        <circle cx="500" cy="300" r="12" fill="var(--linie-rot)" opacity=".6"/>
        <line x1="150" y1="10" x2="150" y2="590" stroke="var(--linie-rot)" stroke-width="7" opacity=".45"/>
        <line x1="850" y1="10" x2="850" y2="590" stroke="var(--linie-rot)" stroke-width="7" opacity=".45"/>
        <path d="M 150 210 A 90 90 0 0 1 150 390 Z" fill="var(--linie-blau)" opacity=".16"/>
        <path d="M 850 210 A 90 90 0 0 0 850 390 Z" fill="var(--linie-blau)" opacity=".16"/>
      </g>

      <!-- Tore -->
      <g stroke="#fff" stroke-width="6">
        <rect x="86" y="235" width="46" height="130" rx="14" fill="var(--linie-rot)"/>
        <rect x="868" y="235" width="46" height="130" rx="14" fill="var(--linie-rot)"/>
      </g>

      <g id="spieler"></g>
      <g id="konfetti"></g>
    </svg>
  </div>

  <div class="steuerung">
    <button class="neu" id="neuKnopf" type="button">Nochmal</button>
    <button class="puck-knopf" id="puckKnopf" type="button" aria-label="Andere Puck-Seite">
      <span class="wechsel" aria-hidden="true">⇄</span>
      <span>Puck</span>
    </button>
    <button class="puck-knopf wuerfel-knopf" id="wuerfelKnopf" type="button" aria-label="Neue Aufgabe würfeln">
      <svg id="wuerfelIcon" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="4" y="4" width="40" height="40" rx="10" fill="#fff"/>
        <circle cx="15" cy="15" r="4.2" fill="#16212B"/>
        <circle cx="33" cy="15" r="4.2" fill="#16212B"/>
        <circle cx="24" cy="24" r="4.2" fill="#16212B"/>
        <circle cx="15" cy="33" r="4.2" fill="#16212B"/>
        <circle cx="33" cy="33" r="4.2" fill="#16212B"/>
      </svg>
    </button>
  </div>
</div>

<script>
(function(){
  const svg      = document.getElementById('board');
  const gruppe   = document.getElementById('spieler');
  const rahmen   = document.getElementById('rahmen');
  const statusEl = document.getElementById('statusText');
  const aufgabeEl= document.getElementById('aufgabeText');
  const konfettiG= document.getElementById('konfetti');
  const wuerfelIcon = document.getElementById('wuerfelIcon');
  const pfeilG   = document.getElementById('pfeilGross');

  const FARBE = {
    wir:     getCSS('--wir'),
    wirTief: getCSS('--wir-tief'),
    geg:     getCSS('--gegner'),
    gegTief: getCSS('--gegner-tief')
  };
  function getCSS(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  // Jede Aufgabe steht für sich. start = wo er anfängt, ziel = wo er hin soll.
  // Die beiden dürfen NIE gleich sein, sonst gibt es nichts zu tun.
  // puck = 'wir' oder 'gegner' — bestimmt Farbe, Pfeilrichtung und Statuszeile.
  // Neue Aufgaben einfach unten anhängen, sonst ist nichts anzupassen.
  const AUFGABEN = [
    {
      puck:'wir',
      start:{x:280, y:430},
      ziel: {x:700, y:300},
      mate: [{x:610, y:120},{x:560, y:480}],
      geg:  [{x:810, y:210},{x:820, y:400},{x:470, y:300}],
      text:'Wir haben den Puck! Fahr nach vorne und biete dich an.',
      lob: 'Super! Vorne hilft man mit.'
    },
    {
      puck:'wir',
      start:{x:620, y:300},
      ziel: {x:790, y:470},
      mate: [{x:540, y:170},{x:330, y:380}],
      geg:  [{x:700, y:180},{x:760, y:300},{x:480, y:460}],
      text:'Dein Freund hat den Puck. Fahr zum Tor, damit er dir zuspielen kann!',
      lob: 'Genau! Vor dem Tor kannst du Tore schießen.'
    },
    {
      puck:'wir',
      start:{x:250, y:170},
      ziel: {x:500, y:300},
      mate: [{x:180, y:400},{x:700, y:210}],
      geg:  [{x:380, y:250},{x:620, y:430},{x:800, y:330}],
      text:'Der Puck kommt aus unserer Ecke. Fahr in die Mitte und hol ihn ab!',
      lob: 'Toll! In der Mitte bist du gut zu finden.'
    },
    {
      puck:'gegner',
      start:{x:730, y:180},
      ziel: {x:300, y:300},
      mate: [{x:380, y:140},{x:360, y:465}],
      geg:  [{x:520, y:300},{x:430, y:150},{x:450, y:455}],
      text:'Der Gegner hat den Puck! Fahr zurück vor dein Tor.',
      lob: 'Stark! Du hilfst hinten mit.'
    },
    {
      puck:'gegner',
      start:{x:520, y:150},
      ziel: {x:330, y:430},
      mate: [{x:300, y:180},{x:600, y:320}],
      geg:  [{x:450, y:450},{x:640, y:170},{x:720, y:400}],
      text:'Ein Gegner fährt zu deinem Tor. Fahr zwischen ihn und das Tor!',
      lob: 'Klasse! Immer zwischen Gegner und Tor.'
    },
    {
      puck:'gegner',
      start:{x:800, y:300},
      ziel: {x:540, y:235},
      mate: [{x:400, y:420},{x:250, y:280}],
      geg:  [{x:620, y:170},{x:700, y:430},{x:450, y:300}],
      text:'Der Gegner ganz nah bei dir hat den Puck. Fahr hin und störe ihn!',
      lob: 'Ja! Nah dran ist er nervös.'
    }
  ];

  let nr = 0;                       // welche Aufgabe gerade läuft
  let zustand = AUFGABEN[0].puck;
  let geschafft = false;

  // --- Spielfiguren bauen ---------------------------------------------------
  // Alle SVG-Knoten hierüber bauen. innerHTML funktioniert auf SVG-Elementen
  // in iOS-Safari nicht zuverlässig und bricht das ganze Skript ab.
  function svgEl(tag, attrs){
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function token(id, r, fill, extra){
    const g = svgEl('g', {class:'token', id:id});
    g.appendChild(svgEl('circle', {r:r, fill:fill}));
    if (extra) g.appendChild(extra);
    gruppe.appendChild(g);
    return g;
  }
  function stern(){
    return svgEl('path', {
      d:'M0 -26 L7.6 -8.4 L26.5 -8.4 L11.5 3.2 L17 21 L0 10.5 L-17 21 L-11.5 3.2 L-26.5 -8.4 L-7.6 -8.4 Z',
      fill:'#fff'
    });
  }

  const gegner = AUFGABEN[0].geg.map((_,i)=> token('geg'+i, 40, FARBE.geg));
  const mates  = AUFGABEN[0].mate.map((_,i)=> token('mate'+i, 40, FARBE.wir));

  const du = token('du', 54, FARBE.wir, stern());
  const ring = svgEl('circle', {r:66, class:'du-ring'}); du.appendChild(ring);
  const puls = svgEl('circle', {r:66, class:'puls'}); du.appendChild(puls);

  // Richtungspfeil am eigenen Spieler
  const meinPfeil = svgEl('g', {transform:'translate(86,0)'});
  meinPfeil.appendChild(svgEl('path', {
    d:'M -8 -14 L 26 0 L -8 14 L -2 0 Z',
    fill:'#fff', stroke:'#16212B', 'stroke-width':4, 'stroke-linejoin':'round'
  }));
  du.appendChild(meinPfeil);

  const puck = svgEl('g', {class:'token'});
  puck.appendChild(svgEl('ellipse', {rx:19, ry:14, fill:'#0C1319', stroke:'#fff', 'stroke-width':4}));
  gruppe.appendChild(puck);

  // --- Zustand anwenden -----------------------------------------------------
  function setze(el, p){ el.setAttribute('transform','translate('+p.x+','+p.y+')'); }

  function anwenden(){
    const a = AUFGABEN[nr];
    zustand = a.puck;
    const istWir = zustand === 'wir';
    const farbe  = istWir ? FARBE.wir : FARBE.geg;
    const tief   = istWir ? FARBE.wirTief : FARBE.gegTief;

    document.documentElement.style.setProperty('--aktiv', farbe);
    document.documentElement.style.setProperty('--aktiv-tief', tief);
    statusEl.textContent = istWir ? 'Wir haben den Puck' : 'Gegner hat den Puck';
    aufgabeEl.textContent = a.text;
    aufgabeEl.classList.remove('geloest');

    setze(du, a.start);
    pos.x = a.start.x; pos.y = a.start.y;
    a.mate.forEach((p,i)=> setze(mates[i], p));
    a.geg.forEach((p,i)=> setze(gegner[i], p));

    // Puck neben den Spieler legen, der ihn hat.
    // Bei "wir" hat ihn ein Mitspieler, nicht er selbst — er soll sich ja anbieten.
    const halter = istWir ? a.mate[0] : a.geg[0];
    setze(puck, {x: halter.x + (istWir ? 44 : -44), y: halter.y + 42});

    // Riesenpfeil dreht sich: nach vorne oder zurück
    pfeilG.setAttribute('fill', farbe);
    pfeilG.setAttribute('transform', istWir ? 'translate(0,0)' : 'translate(1000,600) rotate(180)');
    meinPfeil.setAttribute('transform', istWir ? 'translate(86,0)' : 'translate(-86,0) rotate(180)');

    geschafft = false;
    while (konfettiG.firstChild) konfettiG.removeChild(konfettiG.firstChild);
  }

  // Zufällig, aber nie zweimal dieselbe hintereinander.
  function zufall(nurDiese){
    const moeglich = AUFGABEN
      .map((a,i)=> i)
      .filter(i => i !== nr && (!nurDiese || AUFGABEN[i].puck === nurDiese));
    if(!moeglich.length) return;
    nr = moeglich[Math.floor(Math.random()*moeglich.length)];
    anwenden();
  }

  function wuerfeln(){
    wuerfelIcon.animate(
      [{transform:'rotate(0deg) scale(1)'},
       {transform:'rotate(360deg) scale(1.2)'},
       {transform:'rotate(720deg) scale(1)'}],
      {duration:500, easing:'ease-out'}
    );
    zufall(null);
  }

  // Puck-Knopf: neue Aufgabe, aber mit der jeweils anderen Puck-Seite.
  function wechsle(){
    zufall(zustand === 'wir' ? 'gegner' : 'wir');
  }

  // --- Ziehen ---------------------------------------------------------------
  let zieht = false;
  const pos = {x:0, y:0};

  function svgPunkt(ev){
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  du.addEventListener('pointerdown', ev=>{
    zieht = true;
    du.classList.add('zieht');
    du.setPointerCapture(ev.pointerId);
    ev.preventDefault();
  });

  du.addEventListener('pointermove', ev=>{
    if(!zieht) return;
    const p = svgPunkt(ev);
    pos.x = Math.max(70, Math.min(930, p.x));
    pos.y = Math.max(70, Math.min(530, p.y));
    setze(du, pos);
  });

  function loslassen(ev){
    if(!zieht) return;
    zieht = false;
    du.classList.remove('zieht');
    pruefe();
  }
  du.addEventListener('pointerup', loslassen);
  du.addEventListener('pointercancel', loslassen);

  function pruefe(){
    if(geschafft) return;
    const a = AUFGABEN[nr];
    // Ohne sichtbaren Kreis muss die Trefferzone großzügig sein.
    const d = Math.hypot(pos.x - a.ziel.x, pos.y - a.ziel.y);
    if(d < 170){
      setze(du, a.ziel);
      pos.x = a.ziel.x; pos.y = a.ziel.y;
      geschafft = true;
      aufgabeEl.textContent = a.lob;
      aufgabeEl.classList.add('geloest');
      jubel();
    }
  }

  function jubel(){
    const ziel = AUFGABEN[nr].ziel;

    // Ring stößt sich ab
    puls.animate(
      [{transform:'scale(1)', opacity:.95},{transform:'scale(2.4)', opacity:0}],
      {duration:700, easing:'ease-out'}
    );
    // Spieler hüpft kurz
    du.animate(
      [{transform:'translate('+ziel.x+'px,'+ziel.y+'px) scale(1)'},
       {transform:'translate('+ziel.x+'px,'+ziel.y+'px) scale(1.35)'},
       {transform:'translate('+ziel.x+'px,'+ziel.y+'px) scale(1)'}],
      {duration:520, easing:'ease-out'}
    );

    // Sterne fliegen nach außen
    const farben = ['#F2A413','#FFFFFF','#FFD874','#2B5FA8'];
    for(let i=0; i<14; i++){
      const winkel = (Math.PI*2/14)*i + Math.random()*.4;
      const weite  = 130 + Math.random()*110;
      const s = svgEl('path', {
        d:'M0 -13 L3.8 -4.2 L13.2 -4.2 L5.7 1.6 L8.5 10.5 L0 5.2 L-8.5 10.5 L-5.7 1.6 L-13.2 -4.2 L-3.8 -4.2 Z',
        fill: farben[i % farben.length],
        transform:'translate('+ziel.x+','+ziel.y+')'
      });
      konfettiG.appendChild(s);
      const anim = s.animate([
        {transform:'translate('+ziel.x+'px,'+ziel.y+'px) scale(.4) rotate(0deg)', opacity:1},
        {transform:'translate('+(ziel.x+Math.cos(winkel)*weite)+'px,'+
                                (ziel.y+Math.sin(winkel)*weite)+'px) scale(1.5) rotate('+
                                (Math.random()*540-270)+'deg)', opacity:0}
      ], {duration:750 + Math.random()*350, easing:'cubic-bezier(.2,.7,.4,1)'});
      anim.onfinish = ()=> s.remove();
    }
  }

  // Tastatur: Pfeiltasten bewegen den eigenen Spieler
  document.addEventListener('keydown', ev=>{
    const schritt = 25;
    const m = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]}[ev.key];
    if(!m) return;
    ev.preventDefault();
    const t = du.getAttribute('transform').match(/-?\d+(\.\d+)?/g).map(Number);
    pos.x = Math.max(70, Math.min(930, t[0] + m[0]*schritt));
    pos.y = Math.max(70, Math.min(530, t[1] + m[1]*schritt));
    du.classList.add('zieht');
    setze(du, pos);
    clearTimeout(window.__kbTimer);
    window.__kbTimer = setTimeout(()=>{ du.classList.remove('zieht'); pruefe(); }, 220);
  });

  document.getElementById('puckKnopf').addEventListener('click', wechsle);
  document.getElementById('wuerfelKnopf').addEventListener('click', wuerfeln);
  document.getElementById('neuKnopf').addEventListener('click', anwenden);

  anwenden();
})();

// Offline-Betrieb. Läuft nur über http(s), beim direkten Öffnen der Datei nicht.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
